<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Змейка на двоих</title>
    <style>
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 3px solid #00f2fe;
            border-radius: 10px;
            background: #0f0c29;
        }
        .header { display: flex; gap: 80px; font-size: 1.2em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Змейка X2</h2>
    <div class="header">
        <span style="color:#ff416c">Игрок 1 (WASD): <b id="s1">0</b></span>
        <span style="color:#00b4db">Игрок 2 (Стрелки): <b id="s2">0</b></span>
    </div>
    <canvas id="game" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const grid = 20;

        let p1 = { x: 100, y: 200, dx: grid, dy: 0, body: [], color: '#ff416c', score: 0 };
        let p2 = { x: 500, y: 200, dx: -grid, dy: 0, body: [], color: '#00b4db', score: 0 };
        let food = { x: 300, y: 200 };
        let gameOver = false;

        window.addEventListener('keydown', e => {
            if (e.key.toLowerCase() === 'w' && p1.dy === 0) { p1.dx = 0; p1.dy = -grid; }
            if (e.key.toLowerCase() === 's' && p1.dy === 0) { p1.dx = 0; p1.dy = grid; }
            if (e.key.toLowerCase() === 'a' && p1.dx === 0) { p1.dx = -grid; p1.dy = 0; }
            if (e.key.toLowerCase() === 'd' && p1.dx === 0) { p1.dx = grid; p1.dy = 0; }

            if (e.key === 'ArrowUp' && p2.dy === 0) { p2.dx = 0; p2.dy = -grid; }
            if (e.key === 'ArrowDown' && p2.dy === 0) { p2.dx = 0; p2.dy = grid; }
            if (e.key === 'ArrowLeft' && p2.dx === 0) { p2.dx = -grid; p2.dy = 0; }
            if (e.key === 'ArrowRight' && p2.dx === 0) { p2.dx = grid; p2.dy = 0; }
        });

        function spawnFood() {
            food.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
            food.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
        }

        function updateSnake(p, enemy) {
            p.x += p.dx;
            p.y += p.dy;

            // Столкновение со стенами
            if (p.x < 0 || p.x >= canvas.width || p.y < 0 || p.y >= canvas.height) return true;

            // Столкновение со своим или чужим хвостом
            let allSegments = [...p.body, ...enemy.body];
            if (allSegments.some(seg => seg.x === p.x && seg.y === p.y)) return true;

            p.body.unshift({ x: p.x, y: p.y });

            // Поедание еды
            if (p.x === food.x && p.y === food.y) {
                p.score += 10;
                spawnFood();
            } else {
                p.body.pop();
            }
            return false;
        }

        function loop() {
            if (gameOver) return;

            let crash1 = updateSnake(p1, p2);
            let crash2 = updateSnake(p2, p1);

            if (crash1 || crash2) {
                gameOver = true;
                let msg = 'Ничья!';
                if (crash1 && !crash2) msg = 'Победил Синий Игрок!';
                if (!crash1 && crash2) msg = 'Победил Красный Игрок!';
                alert(`Игра окончена! ${msg}`);
                document.location.reload();
                return;
            }

            document.getElementById('s1').innerText = p1.score;
            document.getElementById('s2').innerText = p2.score;

            // Отрисовка
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Еда
            ctx.fillStyle = '#f7b731';
            ctx.fillRect(food.x, food.y, grid - 2, grid - 2);

            // Змейки
            [p1, p2].forEach(p => {
                ctx.fillStyle = p.color;
                p.body.forEach(seg => ctx.fillRect(seg.x, seg.y, grid - 2, grid - 2));
            });

            setTimeout(loop, 110);
        }

        spawnFood();
        loop();
    </script>
</body>
      </html>
