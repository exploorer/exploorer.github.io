<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пинг-Понг</title>
    <style>
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 3px solid #00f2fe;
            border-radius: 10px;
            background: #0f0c29;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 40px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h2>Пинг-Понг</h2>
    <canvas id="pong" width="600" height="350"></canvas>
    <div class="controls">
        <span>Игрок 1: W / S</span>
        <span>Игрок 2: Стрелки ↑ / ↓</span>
    </div>

    <script>
        const canvas = document.getElementById('pong');
        const ctx = canvas.getContext('2d');

        const p1 = { x: 10, y: 130, w: 10, h: 80, dy: 0, score: 0 };
        const p2 = { x: 580, y: 130, w: 10, h: 80, dy: 0, score: 0 };
        const ball = { x: 300, y: 175, r: 7, vx: 4, vy: 4 };

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function update() {
            // Движение ракеток
            if (keys['w'] || keys['W']) p1.y = Math.max(0, p1.y - 6);
            if (keys['s'] || keys['S']) p1.y = Math.min(canvas.height - p1.h, p1.y + 6);
            if (keys['ArrowUp']) p2.y = Math.max(0, p2.y - 6);
            if (keys['ArrowDown']) p2.y = Math.min(canvas.height - p2.h, p2.y + 6);

            // Движение мяча
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Отскок от стен верх/низ
            if (ball.y - ball.r < 0 || ball.y + ball.r > canvas.height) ball.vy *= -1;

            // Отскок от ракеток
            if (collides(ball, p1) || collides(ball, p2)) ball.vx *= -1.1;

            // Гол
            if (ball.x < 0) { p2.score++; resetBall(); }
            if (ball.x > canvas.width) { p1.score++; resetBall(); }
        }

        function collides(b, p) {
            return b.x - b.r < p.x + p.w && b.x + b.r > p.x &&
                   b.y > p.y && b.y < p.y + p.h;
        }

        function resetBall() {
            ball.x = 300; ball.y = 175;
            ball.vx = (Math.random() > 0.5 ? 4 : -4);
            ball.vy = 4;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Сетка по центру
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 350); ctx.stroke();

            // Ракетки
            ctx.fillStyle = '#ff416c'; ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
            ctx.fillStyle = '#00b4db'; ctx.fillRect(p2.x, p2.y, p2.w, p2.h);

            // Мяч
            ctx.fillStyle = '#00f2fe';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

            // Счет
            ctx.font = '30px Arial';
            ctx.fillStyle = '#fff';
            ctx.fillText(p1.score, 200, 40);
            ctx.fillText(p2.score, 380, 40);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
