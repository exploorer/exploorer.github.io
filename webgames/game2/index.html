<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Битва Кликов</title>
    <style>
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .timer { font-size: 2.5em; margin: 15px; color: #00f2fe; }
        .container {
            display: flex;
            width: 100%;
            height: 70vh;
        }
        .player-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
        }
        #p1 { background: #ff416c; }
        #p2 { background: #00b4db; }
        .player-zone:active { opacity: 0.8; }
        .score { font-size: 5em; font-weight: bold; }
        .key-hint { font-size: 1.2em; opacity: 0.8; margin-top: 10px; }
        button {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 1.2em;
            background: #00f2fe;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="timer" id="timer">10</div>
    <div class="container">
        <div class="player-zone" id="p1" onclick="addScore(1)">
            <div>Игрок 1</div>
            <div class="score" id="s1">0</div>
            <div class="key-hint">Жми клавишу "A" или Тапай</div>
        </div>
        <div class="player-zone" id="p2" onclick="addScore(2)">
            <div>Игрок 2</div>
            <div class="score" id="s2">0</div>
            <div class="key-hint">Жми клавишу "L" или Тапай</div>
        </div>
    </div>
    <button id="btn" onclick="startGame()">Начать раунд!</button>

    <script>
        let s1 = 0, s2 = 0, time = 10, timerId = null, running = false;

        function addScore(player) {
            if (!running) return;
            if (player === 1) document.getElementById('s1').innerText = ++s1;
            if (player === 2) document.getElementById('s2').innerText = ++s2;
        }

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'a') addScore(1);
            if (e.key.toLowerCase() === 'l') addScore(2);
        });

        function startGame() {
            s1 = 0; s2 = 0; time = 10;
            running = true;
            document.getElementById('s1').innerText = 0;
            document.getElementById('s2').innerText = 0;
            document.getElementById('timer').innerText = time;
            document.getElementById('btn').disabled = true;

            clearInterval(timerId);
            timerId = setInterval(() => {
                time--;
                document.getElementById('timer').innerText = time;
                if (time <= 0) {
                    clearInterval(timerId);
                    running = false;
                    document.getElementById('btn').disabled = false;
                    if (s1 > s2) alert('Победил Игрок 1! 🏆');
                    else if (s2 > s1) alert('Победил Игрок 2! 🏆');
                    else alert('Ничья! 🤝');
                }
            }, 1000);
        }
    </script>
</body>
  </html>
